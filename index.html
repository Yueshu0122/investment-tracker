<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>投资资产记录</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --subtext: #86868b;
    --border: #e5e5e7;
    --blue: #007aff;
    --green: #34c759;
    --red: #ff3b30;
    --orange: #ff9500;
    --shadow: 0 2px 12px rgba(0,0,0,.05);
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 900px;
    margin: 0 auto;
    padding-bottom: 40px;
}

/* ================= Header ================= */

.header {
    padding: 22px 18px 12px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.header p {
    margin: 6px 0 0;
    color: var(--subtext);
    font-size: 14px;
}

/* ================= Tabs ================= */

.tabs {
    display: flex;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
}

.tab {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 14px 5px;
    color: var(--subtext);
    font-size: 15px;
    font-weight: 600;
}

.tab.active {
    color: var(--blue);
    box-shadow: inset 0 -2px 0 var(--blue);
}

/* ================= Content ================= */

.content {
    padding: 14px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

/* ================= Cards ================= */

.card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow: hidden;
}

.card-header {
    padding: 16px 17px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.card-title {
    font-size: 17px;
    font-weight: 700;
}

.card-body {
    padding: 14px 17px 17px;
}

/* ================= Buttons ================= */

.primary-btn {
    border: 0;
    background: var(--blue);
    color: white;
    border-radius: 11px;
    padding: 10px 15px;
    font-size: 14px;
    font-weight: 600;
}

.secondary-btn {
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 14px;
}

.danger-btn {
    border: 0;
    background: #fff0ef;
    color: var(--red);
    border-radius: 9px;
    padding: 7px 10px;
    font-size: 13px;
}

.small-btn {
    padding: 6px 9px;
    font-size: 12px;
}

/* ================= Assets ================= */

.asset-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.asset-item {
    padding: 15px 16px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: #fff;
}

.asset-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.asset-name {
    font-size: 18px;
    font-weight: 700;
}

.asset-meta {
    margin-top: 4px;
    color: var(--subtext);
    font-size: 12px;
}

.asset-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
}

.stat {
    background: #f7f7f8;
    border-radius: 9px;
    padding: 9px;
}

.stat-label {
    color: var(--subtext);
    font-size: 11px;
}

.stat-value {
    margin-top: 3px;
    font-size: 14px;
    font-weight: 600;
}

.asset-actions {
    margin-top: 13px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

/* ================= Form ================= */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    color: #555;
    font-weight: 500;
}

input,
select {
    width: 100%;
    border: 1px solid #d9d9dd;
    background: #fff;
    border-radius: 10px;
    padding: 11px 12px;
    outline: none;
    color: var(--text);
}

input:focus,
select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0,122,255,.1);
}

.form-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

/* ================= Transaction ================= */

.transaction-list {
    display: flex;
    flex-direction: column;
}

.transaction {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.transaction:last-child {
    border-bottom: 0;
}

.transaction-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.transaction-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.type-badge {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
}

.type-buy {
    background: #eaf8ee;
    color: var(--green);
}

.type-sell {
    background: #fff0ef;
    color: var(--red);
}

.transaction-date {
    font-size: 14px;
    font-weight: 600;
}

.transaction-detail {
    color: var(--subtext);
    font-size: 12px;
    margin-top: 3px;
}

.transaction-amount {
    text-align: right;
}

.transaction-price {
    font-size: 15px;
    font-weight: 600;
}

.transaction-total {
    color: var(--subtext);
    font-size: 12px;
    margin-top: 3px;
}

.transaction-actions {
    display: flex;
    gap: 6px;
    margin-top: 9px;
    justify-content: flex-end;
}

/* ================= Summary ================= */

.summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.summary-item {
    background: #f7f7f8;
    border-radius: 11px;
    padding: 13px;
}

.summary-label {
    color: var(--subtext);
    font-size: 12px;
}

.summary-value {
    margin-top: 5px;
    font-size: 18px;
    font-weight: 700;
}

/* ================= Chart ================= */

.chart-container {
    position: relative;
    width: 100%;
    height: 320px;
    padding: 5px 0;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.chart-empty {
    height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--subtext);
    font-size: 14px;
}

/* ================= Month ================= */

.month-selector {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 0 10px;
}

.month-selector::-webkit-scrollbar {
    display: none;
}

.month-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: white;
    color: #666;
    padding: 7px 11px;
    border-radius: 9px;
    font-size: 12px;
}

.month-btn.active {
    background: #eef6ff;
    color: var(--blue);
    border-color: #bcdcff;
}

/* ================= Modal ================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 20px;
}

.modal-title {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 18px;
}

.modal-close {
    float: right;
    border: 0;
    background: #f2f2f3;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 18px;
}

/* ================= Empty ================= */

.empty {
    text-align: center;
    color: var(--subtext);
    padding: 35px 15px;
    font-size: 14px;
}

/* ================= Settings ================= */

.setting-row {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.setting-row:last-child {
    border-bottom: 0;
}

.setting-title {
    font-weight: 600;
    font-size: 15px;
}

.setting-description {
    color: var(--subtext);
    font-size: 12px;
    margin-top: 4px;
}

.setting-actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

/* ================= Toast ================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30,30,30,.92);
    color: white;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 200;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ================= Responsive ================= */

@media (max-width: 600px) {

    .header h1 {
        font-size: 25px;
    }

    .content {
        padding: 10px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .asset-stats {
        grid-template-columns: repeat(3, 1fr);
    }

    .summary-grid {
        grid-template-columns: 1fr 1fr;
    }

    .chart-container {
        height: 280px;
    }
}

@media (min-width: 700px) {

    .modal {
        align-items: center;
        padding: 20px;
    }

    .modal-box {
        border-radius: 20px;
    }

}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1>投资资产记录</h1>
        <p>记录实际投入金额，自动计算持仓成本</p>
    </header>

    <nav class="tabs">

        <button
            class="tab active"
            data-page="assetsPage">
            资产
        </button>

        <button
            class="tab"
            data-page="chartPage">
            图表
        </button>

        <button
            class="tab"
            data-page="settingsPage">
            数据
        </button>

    </nav>


    <main class="content">

        <!-- ================= 资产 ================= -->

        <section
            id="assetsPage"
            class="page active">

            <div class="card">

                <div class="card-header">

                    <div class="card-title">
                        我的资产
                    </div>

                    <button
                        class="primary-btn"
                        onclick="openAssetModal()">
                        ＋ 新建资产
                    </button>

                </div>


                <div class="card-body">

                    <div
                        id="assetList"
                        class="asset-list">
                    </div>

                </div>

            </div>

        </section>


        <!-- ================= 图表 ================= -->

        <section
            id="chartPage"
            class="page">

            <div class="card">

                <div class="card-header">

                    <div class="card-title">
                        平均成本走势
                    </div>

                </div>


                <div class="card-body">

                    <div class="form-group">

                        <label>
                            选择资产
                        </label>

                        <select
                            id="chartAssetSelect"
                            onchange="renderChartPage()">
                        </select>

                    </div>


                    <div style="height:15px"></div>


                    <div
                        id="monthSelector"
                        class="month-selector">
                    </div>


                    <div class="chart-container">

                        <canvas
                            id="costChart">
                        </canvas>

                        <div
                            id="chartEmpty"
                            class="chart-empty"
                            style="display:none">
                            暂无交易数据
                        </div>

                    </div>

                </div>

            </div>


            <div class="card">

                <div class="card-header">

                    <div class="card-title">
                        计算方式
                    </div>

                </div>


                <div
                    class="card-body"
                    style="
                        font-size:13px;
                        line-height:1.8;
                        color:#666;
                    ">

                    <p>
                        每笔交易记录的是<strong>实际交易金额</strong>和<strong>数量</strong>。
                    </p>

                    <p>
                        系统自动计算成交单价：
                        <strong>交易金额 ÷ 数量</strong>。
                    </p>

                    <p>
                        买入时，交易金额加入持仓成本。
                        卖出时，按照当时的平均成本扣除对应的持仓成本。
                    </p>

                    <p>
                        因此卖出不会改变剩余持仓的单位平均成本。
                    </p>

                </div>

            </div>

        </section>


        <!-- ================= 数据 ================= -->

        <section
            id="settingsPage"
            class="page">

            <div class="card">

                <div class="card-header">

                    <div class="card-title">
                        数据管理
                    </div>

                </div>


                <div class="card-body">

                    <div class="setting-row">

                        <div class="setting-title">
                            导出数据
                        </div>

                        <div class="setting-description">
                            将所有资产和交易记录导出为 JSON。
                        </div>

                        <div class="setting-actions">

                            <button
                                class="primary-btn"
                                onclick="exportData()">
                                导出 JSON
                            </button>

                        </div>

                    </div>


                    <div class="setting-row">

                        <div class="setting-title">
                            导入数据
                        </div>

                        <div class="setting-description">
                            从之前导出的 JSON 文件恢复数据。
                        </div>

                        <div class="setting-actions">

                            <button
                                class="secondary-btn"
                                onclick="document.getElementById('importFile').click()">
                                导入 JSON
                            </button>

                            <input
                                id="importFile"
                                type="file"
                                accept=".json,application/json"
                                style="display:none"
                                onchange="importData(event)"
                            >

                        </div>

                    </div>


                    <div class="setting-row">

                        <div class="setting-title">
                            当前数据
                        </div>

                        <div
                            class="setting-description"
                            id="dataInfo">
                        </div>

                    </div>


                    <div class="setting-row">

                        <div
                            class="setting-title"
                            style="color:var(--red)">
                            删除全部数据
                        </div>

                        <div class="setting-description">
                            此操作无法恢复。
                        </div>

                        <div class="setting-actions">

                            <button
                                class="danger-btn"
                                onclick="clearAllData()">
                                删除全部数据
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- ================= 新建资产 ================= -->

<div
    id="assetModal"
    class="modal">

    <div class="modal-box">

        <button
            class="modal-close"
            onclick="closeAssetModal()">
            ×
        </button>

        <div class="modal-title">
            新建资产
        </div>


        <form id="assetForm">

            <div class="form-group">

                <label>
                    资产名称
                </label>

                <input
                    id="assetName"
                    type="text"
                    placeholder="例如：VOO、QQQ、TSLA、BTC"
                    required>

            </div>


            <div style="height:14px"></div>


            <div class="form-group">

                <label>
                    备注
                </label>

                <input
                    id="assetNote"
                    type="text"
                    placeholder="可选">

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    onclick="closeAssetModal()">
                    取消
                </button>

                <button
                    type="submit"
                    class="primary-btn">
                    创建资产
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ================= 交易 ================= -->

<div
    id="transactionModal"
    class="modal">

    <div class="modal-box">

        <button
            class="modal-close"
            onclick="closeTransactionModal()">
            ×
        </button>


        <div
            class="modal-title"
            id="transactionModalTitle">
            新增交易
        </div>


        <form id="transactionForm">

            <input
                type="hidden"
                id="editingTransactionId">

            <input
                type="hidden"
                id="transactionAssetId">


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        交易类型
                    </label>

                    <select id="transactionType">

                        <option value="buy">
                            买入
                        </option>

                        <option value="sell">
                            卖出
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        日期
                    </label>

                    <input
                        id="transactionDate"
                        type="date"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        实际交易金额
                    </label>

                    <input
                        id="transactionAmount"
                        type="number"
                        step="any"
                        min="0"
                        placeholder="例如：1000"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        数量
                    </label>

                    <input
                        id="transactionQuantity"
                        type="number"
                        step="any"
                        min="0"
                        placeholder="例如：1.65"
                        required>

                </div>


                <div class="form-group full">

                    <label>
                        自动计算的成交单价
                    </label>

                    <div
                        id="calculatedPrice"
                        style="
                            background:#f7f7f8;
                            border-radius:10px;
                            padding:11px 12px;
                            font-weight:600;
                            color:#333;
                        ">
                        0
                    </div>

                </div>


                <div class="form-group full">

                    <label>
                        备注
                    </label>

                    <input
                        id="transactionNote"
                        type="text"
                        placeholder="可选，例如：月度定投">

                </div>

            </div>


            <div
                style="
                    margin-top:12px;
                    padding:11px;
                    border-radius:10px;
                    background:#f7f7f8;
                    font-size:13px;
                    color:#666;
                ">

                本次交易：
                <strong id="transactionSummary">
                    —
                </strong>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    onclick="closeTransactionModal()">
                    取消
                </button>

                <button
                    type="submit"
                    class="primary-btn">
                    保存
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ================= 资产详情 ================= -->

<div
    id="assetDetailModal"
    class="modal">

    <div class="modal-box">

        <button
            class="modal-close"
            onclick="closeAssetDetailModal()">
            ×
        </button>

        <div id="assetDetailContent"></div>

    </div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

/* ============================================================
   数据
============================================================ */

const STORAGE_KEY =
    "investment_asset_records_v2";


let db =
    loadData();


/* ============================================================
   基础工具
============================================================ */

function generateId() {

    return Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2, 9);

}


function todayString() {

    const now = new Date();

    const y =
        now.getFullYear();

    const m =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;

}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(db)
    );

    updateDataInfo();

}


function loadData() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!raw) {

            return {
                assets: []
            };

        }


        const parsed =
            JSON.parse(raw);


        if (
            !parsed.assets ||
            !Array.isArray(parsed.assets)
        ) {

            return {
                assets: []
            };

        }


        return parsed;

    }

    catch (error) {

        console.error(error);

        return {
            assets: []
        };

    }

}


function formatNumber(
    value,
    digits = 2
) {

    if (
        !Number.isFinite(
            Number(value)
        )
    ) {

        return "0";

    }


    return Number(value)
        .toLocaleString(
            "zh-CN",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: digits
            }
        );

}


function formatMoney(value) {

    return formatNumber(
        value,
        2
    );

}


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 1800);

}


/* ============================================================
   资产计算
============================================================ */

/*
    所有交易按照日期重新计算。

    买入：

    新成本 =
    旧成本 + 本次买入金额

    新数量 =
    旧数量 + 本次买入数量


    卖出：

    当前平均成本 =
    当前成本 / 当前数量

    卖出对应成本 =
    当前平均成本 × 卖出数量

    剩余成本 =
    当前成本 - 卖出对应成本


    注意：

    卖出金额不会加入成本。
    卖出金额只代表你实际收到的钱。

*/

function calculateAsset(asset) {

    const transactions =
        [...asset.transactions]
        .sort(sortTransactions);


    let quantity = 0;

    let cost = 0;

    let totalBuyAmount = 0;

    let totalSellAmount = 0;


    for (
        const tx of transactions
    ) {

        const amount =
            Number(tx.amount);

        const qty =
            Number(tx.quantity);


        if (
            !Number.isFinite(amount) ||
            !Number.isFinite(qty) ||
            amount < 0 ||
            qty <= 0
        ) {

            continue;

        }


        if (tx.type === "buy") {

            cost += amount;

            quantity += qty;

            totalBuyAmount += amount;

        }

        else if (
            tx.type === "sell"
        ) {

            if (quantity > 0) {

                const averageCost =
                    cost / quantity;


                const sellQuantity =
                    Math.min(
                        qty,
                        quantity
                    );


                cost -=
                    averageCost *
                    sellQuantity;


                quantity -=
                    sellQuantity;


                totalSellAmount +=
                    amount;

            }

        }

    }


    const averageCost =
        quantity > 0
            ? cost / quantity
            : 0;


    return {

        quantity,

        cost,

        averageCost,

        totalBuyAmount,

        totalSellAmount

    };

}


function sortTransactions(a, b) {

    if (a.date !== b.date) {

        return a.date.localeCompare(
            b.date
        );

    }


    return a.id.localeCompare(
        b.id
    );

}


/* ============================================================
   月度平均成本
============================================================ */

function calculateMonthlyCost(asset) {

    const transactions =
        [...asset.transactions]
        .sort(sortTransactions);


    if (
        transactions.length === 0
    ) {

        return [];

    }


    let quantity = 0;

    let cost = 0;


    const monthData = {};


    for (
        const tx of transactions
    ) {

        const amount =
            Number(tx.amount);

        const qty =
            Number(tx.quantity);


        if (
            !Number.isFinite(amount) ||
            !Number.isFinite(qty) ||
            amount < 0 ||
            qty <= 0
        ) {

            continue;

        }


        if (
            tx.type === "buy"
        ) {

            cost += amount;

            quantity += qty;

        }

        else if (
            tx.type === "sell"
        ) {

            if (quantity > 0) {

                const averageCost =
                    cost / quantity;


                const sellQuantity =
                    Math.min(
                        qty,
                        quantity
                    );


                cost -=
                    averageCost *
                    sellQuantity;


                quantity -=
                    sellQuantity;

            }

        }


        const month =
            tx.date.substring(
                0,
                7
            );


        const averageCost =
            quantity > 0
                ? cost / quantity
                : 0;


        monthData[month] = {

            month,

            averageCost

        };

    }


    return Object.values(
        monthData
    ).sort(
        (a, b) =>
            a.month.localeCompare(
                b.month
            )
    );

}

/* ============================================================
   保存交易
============================================================ */

document
    .getElementById(
        "transactionForm"
    )
    .addEventListener(
        "submit",
        function(e) {

            e.preventDefault();


            const assetId =
                document.getElementById(
                    "transactionAssetId"
                ).value;


            const asset =
                db.assets.find(
                    x => x.id === assetId
                );


            if (!asset) return;


            const type =
                document.getElementById(
                    "transactionType"
                ).value;


            const date =
                document.getElementById(
                    "transactionDate"
                ).value;


            const amount =
                Number(
                    document.getElementById(
                        "transactionAmount"
                    ).value
                );


            const quantity =
                Number(
                    document.getElementById(
                        "transactionQuantity"
                    ).value
                );


            const note =
                document.getElementById(
                    "transactionNote"
                ).value.trim();


            const editingId =
                document.getElementById(
                    "editingTransactionId"
                ).value;


            if (!date) {

                showToast(
                    "请选择日期"
                );

                return;

            }


            if (
                !Number.isFinite(amount) ||
                amount <= 0
            ) {

                showToast(
                    "请输入有效交易金额"
                );

                return;

            }


            if (
                !Number.isFinite(quantity) ||
                quantity <= 0
            ) {

                showToast(
                    "请输入有效数量"
                );

                return;

            }


            /*
                编辑时：

                先排除原来的交易，
                再验证新的交易是否合理。
            */

            const tempTransactions =
                asset.transactions.filter(
                    tx =>
                        tx.id !== editingId
                );


            const tempAsset = {

                ...asset,

                transactions:
                    tempTransactions

            };


            const current =
                calculateAsset(
                    tempAsset
                );


            /*
                卖出不能超过
                编辑后的历史持仓。
            */

            if (
                type === "sell" &&
                quantity >
                    current.quantity +
                    1e-10
            ) {

                showToast(
                    `卖出数量不能超过当前持仓 ${formatNumber(current.quantity)}`
                );

                return;

            }


            const transaction = {

                id:
                    editingId ||
                    generateId(),

                type,

                date,

                amount,

                quantity,

                note

            };


            if (editingId) {

                const index =
                    asset.transactions
                        .findIndex(
                            tx =>
                                tx.id ===
                                editingId
                        );


                if (index >= 0) {

                    asset.transactions[index] =
                        transaction;

                }

            }

            else {

                asset.transactions.push(
                    transaction
                );

            }


            saveData();

            renderAssets();

            renderChartPage();

            closeTransactionModal();


            showToast(
                editingId
                    ? "交易已修改"
                    : "交易已添加"
            );

        }
    );

function renderCostChart() {

        );


    const canvas =

/* ============================================================
   Canvas
============================================================ */

function drawChart(
    canvas,
    data
) {

    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        window.devicePixelRatio || 1;


    const width =
        rect.width;


    const height =
        rect.height;


    canvas.width =
        width * dpr;


    canvas.height =
        height * dpr;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.scale(
        dpr,
        dpr
    );


    const padding = {

        left: 55,

        right: 18,

        top: 25,

        bottom: 42

    };


    const chartWidth =
        width -
        padding.left -
        padding.right;


    const chartHeight =
        height -
        padding.top -
        padding.bottom;


    const values =
        data.map(
            x =>
                x.averageCost
        );


    let min =
        Math.min(
            ...values
        );


    let max =
        Math.max(
            ...values
        );


    if (
        min === max
    ) {

        min *= 0.95;

        max *= 1.05;


        if (min === 0) {

            max = 1;

        }

    }


    const range =
        max - min;


    min -=
        range * 0.12;


    max +=
        range * 0.12;


    function xPosition(
        index
    ) {

        if (
            data.length === 1
        ) {

            return (
                padding.left +
                chartWidth / 2
            );

        }


        return (
            padding.left +
            (
                index /
                (data.length - 1)
            ) *
            chartWidth
        );

    }


    function yPosition(
        value
    ) {

        return (
            padding.top +
            (
                (max - value) /
                (max - min)
            ) *
            chartHeight
        );

    }


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* 网格 */

    ctx.font =
        "11px -apple-system, BlinkMacSystemFont, sans-serif";


    ctx.textAlign =
        "right";


    ctx.textBaseline =
        "middle";


    const gridCount =
        5;


    for (
        let i = 0;
        i <= gridCount;
        i++
    ) {

        const ratio =
            i /
            gridCount;


        const y =
            padding.top +
            ratio *
            chartHeight;


        const value =
            max -
            ratio *
            (max - min);


        ctx.beginPath();


        ctx.moveTo(
            padding.left,
            y
        );


        ctx.lineTo(
            width -
            padding.right,
            y
        );


        ctx.strokeStyle =
            "#eeeeef";


        ctx.lineWidth =
            1;


        ctx.stroke();


        ctx.fillStyle =
            "#999";


        ctx.fillText(
            formatNumber(
                value
            ),
            padding.left - 8,
            y
        );

    }


    /* 折线 */

    ctx.beginPath();


    data.forEach(
        (item, index) => {

            const x =
                xPosition(
                    index
                );


            const y =
                yPosition(
                    item.averageCost
                );


            if (
                index === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#007aff";


    ctx.lineWidth =
        2.5;


    ctx.lineJoin =
        "round";


    ctx.lineCap =
        "round";


    ctx.stroke();


    /* 数据点 */

    data.forEach(
        (item, index) => {

            const x =
                xPosition(
                    index
                );


            const y =
                yPosition(
                    item.averageCost
                );


            ctx.beginPath();


            ctx.arc(
                x,
                y,
                4,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "#ffffff";


            ctx.fill();


            ctx.strokeStyle =
                "#007aff";


            ctx.lineWidth =
                2;


            ctx.stroke();


            ctx.fillStyle =
                "#888";


            ctx.font =
                "10px -apple-system, BlinkMacSystemFont, sans-serif";


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "top";


            ctx.fillText(
                formatMonthShort(
                    item.month
                ),
                x,
                height -
                padding.bottom +
                12
            );

        }
    );


    ctx.fillStyle =
        "#888";


    ctx.font =
        "11px -apple-system, BlinkMacSystemFont, sans-serif";


    ctx.textAlign =
        "left";


    ctx.textBaseline =
        "top";


    ctx.fillText(
        "平均成本",
        padding.left,
        5
    );

}


function formatMonthShort(
    month
) {

    const parts =
        month.split("-");


    return `${parts[0].slice(2)}-${parts[1]}`;

}

/* ============================================================
   JSON 导出
============================================================ */

function exportData() {

    const exportObject = {

        version: 2,

        exportedAt:
            new Date().toISOString(),

        data: db

    };


    const json =
        JSON.stringify(
            exportObject,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        `investment-record-${todayString()}.json`;


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "数据导出成功"
    );

}


/* ============================================================
   JSON 导入
============================================================ */

function importData(
    event
) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const imported =
                    JSON.parse(
                        e.target.result
                    );


                let newData;


                if (
                    imported &&
                    imported.data &&
                    Array.isArray(
                        imported
                            .data
                            .assets
                    )
                ) {

                    newData =
                        imported.data;

                }

                else if (
                    imported &&
                    Array.isArray(
                        imported.assets
                    )
                ) {

                    newData =
                        imported;

                }

                else {

                    throw new Error(
                        "JSON 格式错误"
                    );

                }


                /*
                    兼容旧版本数据：

                    旧版本使用：

                    amount = price × quantity

                    因此如果导入旧数据，
                    自动把 price × quantity
                    转换成 amount。
                */

                newData.assets =
                    newData.assets.map(
                        asset => {

                            const transactions =
                                Array.isArray(
                                    asset.transactions
                                )
                                ? asset.transactions
                                : [];


                            const converted =
                                transactions.map(
                                    tx => {

                                        if (
                                            tx.amount !==
                                            undefined
                                        ) {

                                            return tx;

                                        }


                                        if (
                                            tx.price !==
                                                undefined &&
                                            tx.quantity !==
                                                undefined
                                        ) {

                                            return {

                                                id:
                                                    tx.id ||
                                                    generateId(),

                                                type:
                                                    tx.type,

                                                date:
                                                    tx.date,

                                                amount:
                                                    Number(
                                                        tx.price
                                                    ) *
                                                    Number(
                                                        tx.quantity
                                                    ),

                                                quantity:
                                                    Number(
                                                        tx.quantity
                                                    ),

                                                note:
                                                    tx.note ||
                                                    ""

                                            };

                                        }


                                        return tx;

                                    }
                                );


                            return {

                                id:
                                    asset.id ||
                                    generateId(),

                                name:
                                    asset.name ||
                                    "未命名资产",

                                note:
                                    asset.note ||
                                    "",

                                createdAt:
                                    asset.createdAt ||
                                    new Date()
                                        .toISOString(),

                                transactions:
                                    converted

                            };

                        }
                    );


                if (
                    !confirm(
                        `确定导入吗？\n\n导入后会覆盖当前的 ${db.assets.length} 个资产。`
                    )
                ) {

                    event.target.value =
                        "";

                    return;

                }


                db =
                    newData;


                saveData();

                renderAssets();

                renderChartPage();

                updateDataInfo();


                showToast(
                    "数据导入成功"
                );

            }

            catch(error) {

                console.error(
                    error
                );


                alert(
                    "导入失败：JSON 文件格式不正确。"
                );

            }


            event.target.value =
                "";

        };


    reader.readAsText(
        file
    );

}


/* ============================================================
   清空
============================================================ */

function clearAllData() {

    if (
        !confirm(
            "确定删除全部数据吗？"
        )
    ) {

        return;

    }


    if (

}


/* ============================================================
   数据统计
============================================================ */

function updateDataInfo() {

    const info =
        document.getElementById(
            "dataInfo"
        );


    if (!info) return;


    const assetCount =
        db.assets.length;


    const transactionCount =
        db.assets.reduce(
            (
                sum,
                asset
            ) =>
                sum +
                asset.transactions.length,
            0
        );


    let storageSize =
        0;


    try {

        storageSize =
            new Blob([
                JSON.stringify(db)
            ]).size;

    }

    catch(e) {}


    info.innerHTML = `

        当前共有
        <strong>
            ${assetCount}
        </strong>
        个资产，

        <strong>
            ${transactionCount}
        </strong>
        条交易记录。

        <br>

        LocalStorage 数据约
        <strong>
            ${formatBytes(
                storageSize
            )}
        </strong>。

    `;

}


function formatBytes(
    bytes
) {

    if (
        bytes < 1024
    ) {

        return bytes + " B";

    }


    if (
        bytes < 1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";

    }


    return (
        bytes /
        1024 /
        1024
    ).toFixed(1) +
    " MB";

}


/* ============================================================
   HTML 安全
============================================================ */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
